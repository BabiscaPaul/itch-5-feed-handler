services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      ITCH_DATA_DIR: /data/runs
    volumes:
      - ./api:/app
      - ./data:/data
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./web:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - api
